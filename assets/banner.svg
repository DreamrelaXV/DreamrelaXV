<svg width="960" height="200" viewBox="0 0 960 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a3a" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121c"/>
      <stop offset="100%" stop-color="#1c1c2e"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0d15" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#0d0d15" stop-opacity="0"/>
      <stop offset="80%" stop-color="#0d0d15" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d0d15" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="960" height="200" fill="url(#bg)"/>
  <rect width="960" height="200" fill="url(#grid)"/>
  <rect width="960" height="200" fill="url(#fade)"/>

  <rect x="20" y="20" width="920" height="160" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>

  <text x="480" y="90" font-family="Segoe UI, Verdana, sans-serif" font-size="26" fill="#e6e6e6" text-anchor="middle" opacity="0.85">Hello, I'm</text>
  <text x="480" y="140" font-family="Segoe UI, Verdana, sans-serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle">Dreamrela</text>

  <!-- Java icon (left), real devicon asset -->
  <image href="https://raw.githubusercontent.com/devicons/devicon/master/icons/java/java-original.svg" x="60" y="65" width="70" height="70"/>

  <!-- Node.js icon (right), real devicon asset -->
  <image href="https://raw.githubusercontent.com/devicons/devicon/master/icons/nodejs/nodejs-original-wordmark.svg" x="830" y="65" width="70" height="70"/>
</svg>
