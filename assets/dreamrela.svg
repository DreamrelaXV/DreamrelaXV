<svg width="960" height="200" viewBox="0 0 960 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3a3a3a" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="82%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconDepth" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="iconBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="960" height="200" fill="#000000"/>
  <rect width="960" height="200" fill="url(#grid)"/>
  <rect width="960" height="200" fill="url(#fade)"/>

  <rect x="16" y="16" width="928" height="168" rx="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.85"/>

  <text x="480" y="82" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="18" letter-spacing="4" fill="#a0a0a0" text-anchor="middle">HELLO, I'M</text>
  <text x="480" y="140" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" text-anchor="middle" filter="url(#textGlow)">Dreamrela</text>

